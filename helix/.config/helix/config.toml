theme = "ashen"

[editor]
line-number = "absolute"
mouse = true
cursorline = true
bufferline = "always"
auto-format = true
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.indent-guides]
render = true
character = "╎"

[editor.statusline]
left = [
    "mode",
    "spacer",
    "spinner",
    "file-name",
    "read-only-indicator",
    "file-modification-indicator",
]

center = []

right = [
    "diagnostics",
    "selections",
    "position",
    "file-encoding",
    "file-type",
]

separator = "│"

mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
