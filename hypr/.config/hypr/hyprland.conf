# .-==================-.
#   ╭╮╷ ╷╭┬╮╷ ╷╭─╮╷╭─╮  
#    ││╭╯│││├─┤│ │ ╰─╮  
#  ╰─╯╰╯ ╵ ╵╵ ╵╰─╯ ╰─╯  
#    ╭─╴╭─╮╭╮╷╭─╴╷╭─╴   
#    │  │ ││╰┤├╴ ││╶╮   
#    ╰─╴╰─╯╵ ╵╵  ╵╰─╯   
# `-==================-`

#  .-=============-.
# <--==[ INPUT ]==-->
#  `-=============-`

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,compose:ralt
    
    follow_mouse = 1
    sensitivity = 0
    
    numlock_by_default = true
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = 0.2
    accel_profile = flat
}

#  .-================-.
# <--==[ MONITORS ]==-->
#  `-================-`

monitor = ,preferred,auto,1

#  .-==============-.
# <--==[ LAYOUT ]==-->
#  `-==============-`

# --===[ General Settings ]==--
general {
    gaps_in = 10
    gaps_out = 10
    
    border_size = 4
    
    # Active border gradient 
    col.active_border = rgb(FF4F5B) rgb(C33030) 45deg
    # Inactive border gradient
    col.inactive_border = rgb(4A8B8B) rgb(3B6F6F) -45deg
    
    resize_on_border = true
    allow_tearing = false
    
    layout = dwindle
}

# --==[ Window Decoration ]==--
decoration {
    rounding = 12
    
    active_opacity = 1.0
    inactive_opacity = 1.0
      
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

# --==[ Animations ]==--
animations {
    enabled = true
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# --==[ Dwindle Layout ]==--
dwindle {
    pseudotile = true
    preserve_split = true
    smart_resizing = true
}

#  .-==============-.
# <--==[ MISC ]==-->
#  `-==============-`

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#  .-=================-.
# <--==[ AUTOSTART ]==-->
#  `-=================-`

exec-once = waybar      
exec-once = mako        
exec-once = awww-daemon 
exec-once = sleep 0.5 && awww img /home/jvmho/Pictures/wallpaper.jpg

#  .-================-.
# <--==[ KEYBINDS ]==-->
#  `-================-`

$mainMod = SUPER

# --==[ Main Keybinds ]==--
bind = $mainMod, Q, exec, kitty
bind = $mainMod SHIFT, C, killactive
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod SHIFT, S, exec, /home/jvmho/.local/bin/screenshot.sh
bind = $mainMod SHIFT, C, killactive
bind = $mainMod, Z, exec, /home/jvmho/Applications/zen/zen

# --==[ Power/Logout ]==--
bind = $mainMod SHIFT, SPACE, exec, ~/.config/waybar/scripts/power.sh
bind = $mainMod SHIFT, E, exec, ~/.config/waybar/scripts/logout.sh

# --==[ Volume / Brightness ]==--
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-

# --==[ Focus Navigation (Vim) ]==--
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# --==[ Workspaces ]==--
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 10, workspace, 10

# --==[ Window Management ]==--
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, R, togglesplit

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 10,movetoworkspace, 10

# --==[ Mouse ]==--
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#  .-====================-.
# <--==[ WINDOW RULES ]==-->
#  `-====================-`

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

#  .-==================-.
# <--==[ ENVIRONMENT ]==-->
#  `-==================-`

env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,12
env = QT_QPA_PLATFORMTHEME,qt6ct
