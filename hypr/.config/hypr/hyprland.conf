# .-==================-.
#   ╭╮╷ ╷╭┬╮╷ ╷╭─╮╷╭─╮  
#    ││╭╯│││├─┤│ │ ╰─╮  
#  ╰─╯╰╯ ╵ ╵╵ ╵╰─╯ ╰─╯  
#    ╭─╴╭─╮╭╮╷╭─╴╷╭─╴   
#    │  │ ││╰┤├╴ ││╶╮   
#    ╰─╴╰─╯╵ ╵╵  ╵╰─╯   
# `-==================-`

#  .-=============-.
# <--==[ INPUT ]==-->
#  `-=============-`

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,compose:ralt
    
    follow_mouse = 1
    sensitivity = 0
    
    numlock_by_default = true
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = 0.2
    accel_profile = flat
}

#  .-================-.
# <--==[ MONITORS ]==-->
#  `-================-`

monitor = ,preferred,auto,1

#  .-==============-.
# <--==[ LAYOUT ]==-->
#  `-==============-`

# --===[ General Settings ]==--
general {
    gaps_in = 10
    gaps_out = 10
    
    border_size = 4
    
    # Active border gradient 
    col.active_border = rgb(FF4F5B) rgb(E69143) 45deg
    # Inactive border gradient
    col.inactive_border = rgb(4A8B8B) rgb(3B6F6F) -45deg
    
    resize_on_border = true
    allow_tearing = false
    
    layout = dwindle
}

# --==[ Window Decoration ]==--
decoration {
    rounding = 12
    
    active_opacity = 1.0
    inactive_opacity = 1.0
      
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

# --==[ Animations ]==--
animations {
    enabled = true
    
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    
    animation = windows,     1, 4.79, easeOutQuint,   slide
    animation = windowsIn,   1, 4.1,  easeOutQuint,   popin 87%
    animation = windowsOut,  1, 1.49, linear, popin   87%
    animation = windowsMove, 1, 4.79, easeOutQuint,   slide
    
    animation = fadeIn,      1, 1.73, almostLinear
    animation = fadeOut,     1, 1.46, almostLinear
    animation = fade,        1, 3.03, quick
    
    animation = workspaces,  1, 1.94, easeInOutCubic, slide
}

# --==[ Dwindle Layout ]==--
dwindle {
    pseudotile = true
    preserve_split = true
    smart_resizing = true
}

#  .-==============-.
# <--==[ MISC ]==-->
#  `-==============-`

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#  .-=================-.
# <--==[ AUTOSTART ]==-->
#  `-=================-`

exec-once = waybar      
exec-once = mako        
exec-once = awww-daemon 
exec-once = sleep 0.5 && awww img /home/jvmho/Pictures/wallpaper.jpg

#  .-================-.
# <--==[ KEYBINDS ]==-->
#  `-================-`

$mainMod = SUPER

# --==[ Main Keybinds ]==--
bind = $mainMod, Q, exec, kitty
bind = $mainMod SHIFT, C, killactive
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod ALT, L, exec, swaylock
bind = $mainMod SHIFT, S, exec, /home/jvmho/.local/bin/screenshot.sh
bind = $mainMod SHIFT, C, killactive
bind = $mainMod, Z, exec, /home/jvmho/Applications/zen/zen

# --==[ Power/Logout ]==--
bind = $mainMod SHIFT, SPACE, exec, ~/.config/waybar/scripts/power.sh
bind = $mainMod SHIFT, E, exec, ~/.config/waybar/scripts/logout.sh

# --==[ Volume / Brightness ]==--
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-

# --==[ Focus Navigation (Vim) ]==--
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# --==[ Workspaces ]==--
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# --==[ Window Management ]==--
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, R, togglesplit

# --==[ Mouse ]==--
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#  .-==================-.
# <--==[ ENVIRONMENT ]==-->
#  `-==================-`

env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,12
env = QT_QPA_PLATFORMTHEME,qt6ct
