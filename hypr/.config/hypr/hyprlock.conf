general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/wallpaper.conf
    blur_passes = 3
    blur_size = 5
    noise = 0.02
    contrast = 0.8
    brightness = 0.5
}

# ╔═══════════════════════════════════════╗
# ║   TOP RIGHT: TIME AND DATE            ║
# ╚═══════════════════════════════════════╝

# Часы
label {
    monitor =
    text = cmd[update:1000] echo "<span weight='bold'>$(date +'%H:%M')</span>"
    color = rgba(4A8B8BFF)
    font_size = 80
    font_family = JetBrains Mono
    position = -78, -40
    halign = right
    valign = top
}

# Дата в ASCII стиле
label {
    monitor =
    text = cmd[update:1000] echo "┌─────────--=====--──────────┐"
    color = rgba(FF4F5BFF)
    font_size = 14
    font_family = JetBrains Mono
    position = -75, -160
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "[  -~< $(date +'%Y.%m.%d') >~-   ]"
    color = rgba(4A8B8BFF)
    font_size = 18
    font_family = JetBrains Mono
    position = -65, -205
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "└────────--=[<*>]=--─────────┘"
    color = rgba(FF4F5BFF)
    font_size = 14
    font_family = JetBrains Mono
    position = -75, -260
    halign = right
    valign = top
}

# ╔═══════════════════════════════════════╗
# ║   BOTTOM LEFT: LOGIN & SYSTEM INFO    ║
# ╚═══════════════════════════════════════╝

# Статус системы
label {
    monitor =
    text = cmd[update:1000] echo "STATUS: [LOCKED]"
    color = rgba(FF4F5BFF)
    font_size = 12
    font_family = JetBrains Mono
    position = 50, 240
    halign = left
    valign = bottom
}

# Поле ввода
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(FF4F5BFF)
    inner_color = rgba(121212CC)
    font_color = rgba(4A8B8BFF)
    fade_on_empty = false
    placeholder_text = <span font_family="JetBrains Mono">access_token:</span>
    hide_input = false
    position = 50, 170
    halign = left
    valign = bottom
    fail_color = rgba(C53030FF)
    fail_text = <span>ERROR: Invalid Token</span>
}

# Декоративная линия снизу
label {
    monitor =
    text = cmd[update:1000] echo "USER: $USER $(hostname)"
    color = rgba(4A8B8BFF)
    font_size = 12
    font_family = JetBrains Mono
    position = 55, 130
    halign = left
    valign = bottom
}

label {
    monitor =
    text = ──────────────────────────────────────────────
    color = rgba(3B6F6FFF) # Темно-синий для второстепенных линий
    font_size = 10
    font_family = JetBrains Mono
    position = 50, 110
    halign = left
    valign = bottom
}

# ASCII Элемент в углу
label {
    monitor =
    text = // SESSION_ACTIVE
    color = rgba(FF4F5BFF)
    font_size = 10
    font_family = JetBrains Mono
    position = 50, 80
    halign = left
    valign = bottom
}

# Краткая системная инфо (заглушка/пример)
label {
    monitor =
    text = cmd[update:1000] echo "UPTIME: $(uptime -p | sed 's/up //')"
    color = rgba(3B6F6FFF)
    font_size = 10
    font_family = JetBrains Mono
    position = 50, 60
    halign = left
    valign = bottom
}
