# .-==================-.
#   ╭╮╷ ╷╭┬╮╷ ╷╭─╮╷╭─╮  
#    ││╭╯│││├─┤│ │ ╰─╮  
#  ╰─╯╰╯ ╵ ╵╵ ╵╰─╯ ╰─╯  
#    ╭─╴╭─╮╭╮╷╭─╴╷╭─╴   
#    │  │ ││╰┤├╴ ││╶╮   
#    ╰─╴╰─╯╵ ╵╵  ╵╰─╯   
# `-==================-`

#  .-=============-.
# <--==[ INPUT ]==-->
#  `-=============-`

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,compose:ralt
    
    follow_mouse = 1
    sensitivity = 0
    
    numlock_by_default = true
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# Per-device configuration
device {
    name = epic-mouse-v1
    sensitivity = 0.2
    accel_profile = flat
}

#  .-================-.
# <--==[ MONITORS ]==-->
#  `-================-`

monitor = ,preferred,auto,auto

# Example for specific monitor:
# monitor = eDP-1,1920x1080@120,1280x0,2

#  .-==============-.
# <--==[ LAYOUT ]==-->
#  `-==============-'

# --===[ General Settings ]==--
general {
    gaps_in = 10
    gaps_out = 10
    
    border_size = 4
    
    # Active border gradient (matches Niri)
    col.active_border = rgb(FF4F5B) rgb(E69143) 45deg
    # Inactive border gradient
    col.inactive_border = rgb(4A8B8B) rgb(3B6F6F) -45deg
    
    resize_on_border = true
    allow_tearing = false
    
    layout = dwindle
}

# --==[ Window Decoration ]==--
decoration {
    rounding = 12
    
    active_opacity = 1.0
    inactive_opacity = 1.0
    
    drop_shadow = true
    shadow_range = 30
    shadow_render_power = 3
    shadow_offset = 0 5
    col.shadow = rgba(00000070)
    
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
        new_optimizations = true
    }
}

# --==[ Animations ]==--
animations {
    enabled = true
    
    # Bezier curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    
    # Window animations
    animation = windows, 1, 4.79, easeOutQuint, slide
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = windowsMove, 1, 4.79, easeOutQuint, slide
    
    # Fade animations
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    
    # Border animations
    animation = border, 1, 5.39, easeOutQuint
    animation = borderangle, 1, 100, linear, loop
    
    # Workspace animations
    animation = workspaces, 1, 1.94, almostLinear, slide
    
    # Layer animations
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
}

# --==[ Dwindle Layout ]==--
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# --==[ Master Layout ]==--
master {
    new_status = master
    new_on_active = before
}

#  .-==============-.
# <--==[ MISC ]==-->
#  `-==============-'

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#  .-=================-.
# <--==[ AUTOSTART ]==-->
#  `-=================-'

exec-once = waybar      # Top bar
exec-once = mako        # Notifications
exec-once = awww-daemon # Wallpapers
exec-once = sleep 0.5 && awww img /home/jvmho/Pictures/wallpaper.jpg

#  .-==================-.
# <--==[ WINDOW RULES ]==-->
#  `-==================-'

# Suppress maximize events
windowrulev2 = suppressevent maximize, class:.*

# Fix XWayland dragging issues
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Firefox Picture-in-Picture
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(firefox)$, title:^(Picture-in-Picture)$

# Block screen capture for password managers
windowrulev2 = suppressevent screencast, class:^(org\.keepassxc\.KeePassXC)$
windowrulev2 = suppressevent screencast, class:^(org\.gnome\.World\.Secrets)$

# WezTerm specific settings
windowrulev2 = tile, class:^(org\.wezfurlong\.wezterm)$

# Prefer no CSD (client-side decorations)
windowrulev2 = nodim, floating:0

#  .-================-.
# <--==[ KEYBINDS ]==-->
#  `-=================-'

$mainMod = SUPER

# --==[ Main Keybinds ]==--
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, SPACE, exec, wofi
bind = $mainMod ALT, L, exec, swaylock
bind = $mainMod SHIFT, S, exec, /home/jvmho/.local/bin/screenshot.sh
bind = $mainMod SHIFT, C, killactive
bind = $mainMod, O, overview:toggle
bind = $mainMod, Z, exec, /home/jvmho/Applications/zen/zen

# --==[ Power/Logout ]==--
bind = $mainMod SHIFT, SPACE, exec, ~/.config/waybar/scripts/power.sh
bind = $mainMod SHIFT, E, exec, ~/.config/waybar/scripts/logout.sh

# --==[ Volume Control ]==--
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --==[ Brightness Control ]==--
bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-

# --==[ Focus Navigation ]==--
# Arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# First/Last window
bind = $mainMod, Home, movefocus, beginning
bind = $mainMod, End, movefocus, end

# --==[ Workspace Navigation ]==--
bind = $mainMod, Page_Down, workspace, e-1
bind = $mainMod, Page_Up, workspace, e+1
bind = $mainMod, U, workspace, e-1
bind = $mainMod, I, workspace, e+1

# Numbered workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# --==[ Window Management ]==--
# Move windows with arrow keys
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, right, movewindow, r

# Move windows with vim keys
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, J, movewindow, d
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, L, movewindow, r

# Move to first/last
bind = $mainMod CTRL, Home, movewindow, beginning
bind = $mainMod CTRL, End, movewindow, end

# --==[ Move Window to Workspace ]==--
bind = $mainMod CTRL, Page_Down, movetoworkspace, e-1
bind = $mainMod CTRL, Page_Up, movetoworkspace, e+1
bind = $mainMod CTRL, U, movetoworkspace, e-1
bind = $mainMod CTRL, I, movetoworkspace, e+1

# Move to numbered workspaces
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# --==[ Window Manipulations ]==--
# Resizing
bind = $mainMod, R, exec, hyprctl keyword general:layout master && hyprctl keyword general:layout dwindle
bind = $mainMod SHIFT, R, exec, hyprctl keyword general:layout dwindle && hyprctl keyword general:layout master

bind = $mainMod, Minus, resizeactive, -100 0
bind = $mainMod, Equal, resizeactive, 100 0
bind = $mainMod SHIFT, Minus, resizeactive, 0 -100
bind = $mainMod SHIFT, Equal, resizeactive, 0 100

# Fullscreen and maximize
bind = $mainMod, F, fullscreen, 1  # Maximize (keep bars visible)
bind = $mainMod SHIFT, F, fullscreen, 0  # True fullscreen
bind = $mainMod, M, fullscreen, 1

# Center window
bind = $mainMod, C, centerwindow

# Floating toggle
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, V, focuscurrentorlast

# Pseudo-tiling (dwindle)
bind = $mainMod, P, pseudo

# Split toggle (dwindle)
bind = $mainMod SHIFT, J, togglesplit

# Group/Tab windows
bind = $mainMod, W, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

# Consume/expel windows (similar to Niri)
bind = $mainMod, BracketLeft, moveintogroup, l
bind = $mainMod, BracketRight, moveintogroup, r
bind = $mainMod, Comma, moveintogroup, l
bind = $mainMod, Period, moveoutofgroup

# --==[ Special Workspace (Scratchpad) ]==--
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --==[ Mouse Bindings ]==--
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --==[ System Control ]==--
bind = $mainMod, Escape, exec, # Toggle keyboard shortcuts inhibit (placeholder)
bind = $mainMod SHIFT, P, exec, hyprctl dispatch dpms off

# --==[ Hotkey Overlay ]==--
bind = $mainMod SHIFT, Slash, exec, # Show hotkey overlay (placeholder - needs external tool)

#  .-===================-.
# <--==[ ENVIRONMENT ]==-->
#  `-===================-'

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
