# Parameter name         | Parameter
# --==[ Main Font ]==--

# Основной шрифт
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12

# --==[ Ligatures ]==--

disable_ligatures never

# --==[ Transparency ]==--

background_opacity         0.9
dynamic_background_opacity no
inactive_text_alpha        0.9

# --==[ Window decoration ]==--

hide_window_decorations    titlebar-only
window_padding_width       8

#  .-===================-.
# <--==[ Ashen Theme ]==-->
#  `-===================-`

# --==[ Background and foreground ]==--

background                 #121212
foreground                 #B4B4B4

selection_background       #323232
selection_foreground       #E5E5E5

# --==[ Cursor ]==--

cursor                     #E49A44
cursor_text_color          #121212
cursor_shape               block
cursor_blink_interval      0.2

# --==[ ANSI colors ]==--

color0                     #121212 # Black
color1                     #C53030 # Red
color2                     #4A8B8B # Green
color3                     #E5A72A # Yellow
color4                     #6FA8FF # Blue
color5                     #B14242 # Magenta
color6                     #D87C4A # Cyan
color7                     #B4B4B4 # White

# --==[ Bright ANSI colors ]==--

color8                     #535353 # Bright Black
color9                     #DF6464 # Bright Red
color10                    #7FBDBD # Bright Green
color11                    #F1C04E # Bright Yellow
color12                    #9BC4FF # Bright Blue
color13                    #D06A6A # Bright Magenta
color14                    #F0A35B # Bright Cyan
color15                    #E5E5E5 # Bright White

# --==[ Misc ]==--

scrollback_lines           5000

mouse_hide_wait            2.0

term                       xterm-256color

enable_audio_bell          no
visual_bell_duration       0.0

